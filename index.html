<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF PNG</title>
<meta name="theme-color" content="#3a8a5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-icon-180.png">
<style>
@font-face{font-family:'Pretendard Variable';src:url('./vendor/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
:root{
/* TOKENS:START — docs/1 §3.1 정본(토큰동기.js) */
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db;
  --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968;
  --g800:#333d4b; --g900:#191f28;
  --green50:#f8fbf9; --green100:#e9f8ee; --green200:#cef2db; --green300:#a7e7c0; --green400:#7bcb9c;
  --green500:#57a77a; --green600:#3a8a5f; --green700:#166841; --green800:#01492a; --green900:#002614;
  --green:var(--green600); --green-dark:var(--green700); --green-bg:var(--green100);
  --red:#f04452; --ink-on-dark:#F9FBFA;
  --dark:#525966; --danger:#D25357;
  --danger-weak-bg:#fdecee; --danger-weak-fg:#c0392b;
  --p-disabled:#b7e0c8;
  --warn:#f5a623; --warn-weak-bg:#fef4e2; --warn-weak-fg:#c07f00;
/* TOKENS:END */
  --r-md:14px; --r-lg:20px;
  --fs-title:17px; --fs-body:15px; --fs-sm:13.5px; --fs-caption:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
/* 스크롤바 숨김 — 페이지가 길어질 때 우측 바가 생기며 본문이 살짝 좁아지는 시프트가 '덜 만든 느낌'(유성 07-22). 휠·터치·키보드 스크롤은 그대로. */
::-webkit-scrollbar{width:0;height:0}
html{scrollbar-width:none}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:#fff;color:var(--g900);word-break:keep-all;-webkit-font-smoothing:antialiased}
#app{max-width:1060px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 24px}
svg.li{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── 헤더: 세그먼트 ── */
.hd{display:flex;justify-content:center;padding:22px 0 18px}
.seg{display:flex;background:var(--g100);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:none;font:inherit;font-size:var(--fs-title);font-weight:700;color:var(--g500);padding:11px 34px;border-radius:11px;cursor:pointer;letter-spacing:-.3px;transition:color .15s}
.seg button.on{background:#fff;color:var(--green-dark);box-shadow:0 2px 8px rgba(0,0,0,.07)}

.scr{display:none;flex-direction:column;flex:1;padding-bottom:34px}
.scr.on{display:flex}
.col{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;flex:1}

/* ── 드롭존 ── */
.zone{border:2px dashed var(--g300);border-radius:var(--r-lg);background:var(--g50);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:52px 24px;cursor:pointer;transition:border-color .15s,background .15s;text-align:center}
.zone:hover{border-color:var(--g400)}
.zone.drag{border-color:var(--green500);background:var(--green50)}
.zone .zi{width:52px;height:52px;border-radius:16px;background:var(--green100);color:var(--green-dark);display:flex;align-items:center;justify-content:center}
.zone .zi svg{width:26px;height:26px}
.zone .zt{font-size:18px;font-weight:700;letter-spacing:-.4px}
.zone .zs{font-size:var(--fs-sm);color:var(--g500);font-weight:500}

/* ── 변환: 폴더 칩 + 파일 목록 ── */
.chip{display:flex;align-items:center;gap:9px;background:var(--g50);border-radius:var(--r-md);padding:13px 16px;margin-bottom:14px;font-size:var(--fs-body)}
.chip svg{width:19px;height:19px;color:var(--g500);flex:none}
.chip .ct{flex:1;font-weight:600;color:var(--g700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ct b{color:var(--green-dark)}
.chip button{border:0;background:none;font:inherit;font-size:var(--fs-sm);font-weight:700;color:var(--green600);cursor:pointer;padding:4px 2px;flex:none}
.chip button:active{color:var(--green700)}
.chip .cx{color:var(--g400);font-size:17px;padding:0 2px}
.frows{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:12px;background:var(--g50);border-radius:var(--r-md);padding:13px 16px}
.frow .fi{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--g500);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.frow .fi svg{width:18px;height:18px}
.frow .fn{flex:1;min-width:0}
.frow .fn .n{font-size:var(--fs-body);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fn .s{font-size:var(--fs-caption);color:var(--g500);font-weight:500;margin-top:2px}
.frow .fn .s.ok{color:var(--green600)}
.frow .fn .s.bad{color:var(--red)}
.frow .rm{border:0;background:none;color:var(--g400);cursor:pointer;font-size:19px;padding:4px 6px;flex:none}
.frow .rm:hover{color:var(--g600)}
.pbar{height:4px;border-radius:99px;background:var(--g200);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green500);border-radius:99px;transition:width .2s}
.foot{margin-top:auto;padding-top:22px}
.btn{width:100%;border:0;border-radius:15px;padding:17px;font:inherit;font-size:var(--fs-title);font-weight:700;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn.fill{background:var(--green600);color:#fff}
.btn.fill:active{background:var(--green700)}
.btn.fill:disabled{background:var(--p-disabled);cursor:default;transform:none}
.btn.weak{background:var(--green-bg);color:var(--green-dark)}

/* ── 완료 오버레이 (§4.6: 체크 팝인 → 제목 → 자동 전환·슬라이드) ── */
.doneo{position:fixed;inset:0;background:#fff;z-index:860;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.doneo.on{display:flex}
.doneo.out{transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s;transform:translateX(-44px);opacity:0}
.dcirc{width:86px;height:86px}
.dcirc circle{fill:var(--green600);transform-origin:50% 50%;animation:dpop .38s cubic-bezier(.3,1.5,.5,1) backwards}
.dcirc path{stroke:#fff;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:ddraw .34s ease-out .22s forwards}
@keyframes dpop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes ddraw{to{stroke-dashoffset:0}}
.doneo .dt{font-size:22px;font-weight:800;letter-spacing:-.5px}
.doneo .ds{font-size:var(--fs-body);color:var(--g500);font-weight:500}
/* ── shake (§4.9 비활성 눌림) ── */
@keyframes tfshake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.shake{animation:tfshake .4s}
/* ── 확대(돋보기) ── */
.zoomo{position:fixed;inset:0;background:rgba(25,31,40,.8);z-index:870;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.zoomo.on{display:flex}
.zoomo canvas,.zoomo img{max-width:92vw;max-height:92vh;border-radius:8px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.4)}

/* ── 병합: 페이지 그리드 ── */
.mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:30px}
.mtop .cnt{font-size:var(--fs-body);font-weight:700;color:var(--g700)}
.mtop .cnt b{color:var(--green-dark)}
.grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start}
.card{background:var(--g50);border-radius:var(--r-md);padding:8px 8px 9px;position:relative;cursor:grab;user-select:none;touch-action:none}
.card.ghost{opacity:.25}
.card .th{height:186px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:9px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card .th canvas,.card .th img{max-width:100%;max-height:100%;display:block}
.card .lb{display:flex;align-items:center;gap:6px;margin-top:8px;padding:0 3px}
.card .lb .dot{width:7px;height:7px;border-radius:50%;flex:none}
.card .lb .t{font-size:var(--fs-caption);font-weight:600;color:var(--g600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ops{position:absolute;top:13px;right:13px;display:none;gap:5px}
.card:hover .ops{display:flex}
.card .ops button{width:29px;height:29px;border-radius:9px;border:0;background:rgba(25,31,40,.62);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.card .ops button:hover{background:rgba(25,31,40,.82)}
.card .ops svg{width:15px;height:15px}
.addcard{border:2px dashed var(--g300);border-radius:var(--r-md);min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--g500);cursor:pointer;background:none;font:inherit;transition:border-color .15s,background .15s}
.addcard:hover,.addcard.drag{border-color:var(--green500);background:var(--green50);color:var(--green-dark)}
.addcard svg{width:24px;height:24px}
.addcard span{font-size:var(--fs-sm);font-weight:700}
.insbar{position:absolute;width:4px;border-radius:99px;background:var(--green500);pointer-events:none;display:none;z-index:5}
.fly{position:fixed;z-index:800;pointer-events:none;transform:translate(-50%,-50%) scale(1.04);box-shadow:0 12px 34px rgba(0,0,0,.22);opacity:.95}
.mfoot{display:flex;gap:10px;margin-top:44px}
.mfoot .btn.weak{width:auto;padding:17px 26px;flex:none}
/* 모두 지우기 확인 — 바텀 논모달 시트(§4.4: 좌 닫기·우 파괴 빨강, dim 없음) */
.csheet{position:fixed;left:50%;transform:translateX(-50%) translateY(130%);width:min(420px,calc(100% - 16px));bottom:8px;background:#fff;border-radius:24px;padding:22px 22px 18px;box-shadow:0 -6px 30px rgba(25,31,40,.18);transition:transform .28s cubic-bezier(.2,1,.3,1);z-index:840}
.csheet.on{transform:translateX(-50%) translateY(0)}
.csheet .ct2{font-size:17px;font-weight:800;letter-spacing:-.4px;margin-bottom:14px}
.csheet .cbtns{display:flex;gap:8px}
.csheet .cbtns button{flex:1;border:0;border-radius:13px;padding:15px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s}
.csheet .cbtns button:active{transform:scale(.97)}
.csheet .cx2{background:var(--g100);color:var(--g700)}
.csheet .cgo{background:var(--danger);color:#fff}
.csheet .cgo.ok{background:var(--green600)}   /* 파괴적이지 않은 확정(글자 넣기 등) */

/* ── 편집: 페이지 레일 + 편집 스테이지 ── */
.edwrap{display:flex;gap:18px;align-items:flex-start;flex:1;min-height:0}
.edrail{width:112px;flex:none;display:flex;flex-direction:column;gap:9px;max-height:calc(100dvh - 130px);overflow-y:auto;position:sticky;top:12px}
.edrail button{border:0;background:none;padding:0;font:inherit;cursor:pointer}
.edrail .rth{width:100%;aspect-ratio:1/1.414;background:#fff;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;overflow:hidden;outline:2px solid transparent;transition:outline-color .12s}
.edrail .rth canvas,.edrail .rth img{max-width:100%;max-height:100%;display:block}
.edrail button.on .rth{outline-color:var(--green)}
.edrail .rn{display:flex;align-items:center;justify-content:center;gap:5px;font-size:var(--fs-caption);font-weight:700;color:var(--g500);margin-top:5px}
.edrail button.on .rn{color:var(--green-dark)}
.edrail .rd{width:6px;height:6px;border-radius:50%;background:var(--green);visibility:hidden}
.edrail button.has .rd{visibility:visible}

.edstage{flex:1;min-width:0;display:flex;flex-direction:column}
.edbar{display:flex;align-items:center;gap:6px;margin-bottom:11px}
.edtool{display:flex;align-items:center;gap:6px;border:0;background:var(--g100);color:var(--g700);font:inherit;font-size:var(--fs-sm);font-weight:700;padding:10px 14px;border-radius:11px;cursor:pointer;transition:transform .12s}
.edtool:active{transform:scale(.97)}
.edtool svg{width:16px;height:16px}
/* §4.9 예외 — on/off 모드 토글(펜)은 솔리드 채움+약한 그림자로 '켜짐'을 강하게 */
.edtool.on{background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.13)}
.edtool:disabled{background:var(--g50);color:var(--g300);cursor:default;transform:none}
.edtool.act{background:var(--green-bg);color:var(--green-dark)}   /* 무언가를 '넣는' 액션 = 연초록으로 한 묶음 */
.edgap{flex:1}
/* 도구 세그 — 모드(선택·펜·지우개)는 '넣기' 액션과 다른 문법이어야 한다(§4.9 세그=지금 무엇인가) */
.seg.tool{padding:3px;gap:2px}
.seg.tool button{font-size:var(--fs-sm);padding:9px 15px;border-radius:10px;display:flex;align-items:center;gap:6px}
.seg.tool button svg{width:16px;height:16px}
.seg.tool button.on{background:#fff;color:var(--green-dark);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.edchips{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.edchips .lb{font-size:var(--fs-caption);font-weight:700;color:var(--g500)}
.edchip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--g200);box-shadow:0 1px 3px rgba(25,31,40,.08);border-radius:99px;padding:5px 5px 5px 8px;font:inherit;font-size:var(--fs-caption);font-weight:700;color:var(--g700);cursor:pointer;max-width:230px}
.edchip .ci{width:20px;height:20px;object-fit:contain;flex:none}
.edchip .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edchip .cd{border:0;background:none;font:inherit;color:var(--g400);font-size:15px;padding:0 4px;cursor:pointer;flex:none}
.edchip .cd:hover{color:var(--g600)}

.edcvwrap{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
.edcv{background:var(--g100);border-radius:var(--r-md);padding:18px;display:flex;overflow:auto;flex:1;min-height:360px;outline:2px dashed transparent;outline-offset:-6px;transition:outline-color .15s,background .15s}
.edcv.drag{outline-color:var(--green500);background:var(--green50)}
/* 확대 배율 칩 — 100%가 아닐 때만 나타난다(평소 툴바를 깨끗하게) */
.edzoom{position:absolute;right:12px;top:12px;z-index:3;display:none;align-items:center;gap:8px;background:#fff;border:1px solid var(--g200);box-shadow:0 1px 3px rgba(25,31,40,.08);border-radius:99px;padding:7px 12px;font:inherit;font-size:var(--fs-caption);font-weight:700;color:var(--g700);cursor:pointer;animation:zpop .18s cubic-bezier(.3,1.4,.5,1)}
.edzoom.on{display:flex}
.edzoom b{color:var(--green-dark)}
@keyframes zpop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
/* 페이지 한 장이 화면 안에 다 들어오게 — 세로 여유에서 폭을 역산한다(가로 페이지도 같은 식으로 처리).
   --par(가로÷세로)만 JS가 넣고 치수는 CSS가 정한다(§3.7 매직 px 금지). */
.edpage{position:relative;background:#fff;box-shadow:0 2px 14px rgba(25,31,40,.14);line-height:0;touch-action:none;flex:none;margin:auto;
  aspect-ratio:var(--par,.7071);
  --fitw:min(100%,max(300px,calc((100dvh - 330px) * var(--par,.7071))));
  width:calc(var(--fitw) * var(--zoom,1))}
.edpage canvas.base{display:block;width:100%;height:auto}
.edpage.pen{cursor:crosshair}
.edpage.erase{cursor:cell}
.edpage.erase .edobjs{pointer-events:none}   /* 지우개는 펜 획만 건드린다 */
.edink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.edobjs{position:absolute;inset:0}
.edobj{position:absolute;cursor:move;touch-action:none}
.edobj img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.edobj.sel{outline:1.5px solid var(--green);outline-offset:2px}
.edobj .h{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--green);display:none}
.edobj.sel .h{display:block}
.edobj .h.nw{left:-7px;top:-7px;cursor:nwse-resize}
.edobj .h.ne{right:-7px;top:-7px;cursor:nesw-resize}
.edobj .h.sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.edobj .h.se{right:-7px;bottom:-7px;cursor:nwse-resize}
.edsz{position:absolute;left:50%;top:-31px;transform:translateX(-50%);background:var(--g800);color:#fff;font-size:11px;font-weight:700;line-height:1;border-radius:7px;padding:5px 8px;white-space:nowrap;display:none}
.edobj.sizing .edsz{display:block}

.edfoot{margin-top:22px}
.edfoot .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.edcnt{font-size:var(--fs-sm);font-weight:700;color:var(--g600)}
.edcnt b{color:var(--green-dark)}
.seg.sm{padding:3px}
.seg.sm button{font-size:var(--fs-sm);font-weight:700;padding:8px 18px;border-radius:9px}
.edbtns{display:flex;gap:10px}
.edbtns .btn.weak{width:auto;padding:17px 26px;flex:none}
.edtxt{display:flex;flex-direction:column;gap:10px}
.edtxt input{border:0;background:var(--g100);border-radius:var(--r-md);padding:15px 16px;font:inherit;font-size:var(--fs-title);font-weight:600;outline:none;width:100%}
.edtxt input:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--green)}

/* ── 오버레이·토스트 ── */
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:850;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.busy.on{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--green100);border-top-color:var(--green500);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy .bt{font-size:var(--fs-body);font-weight:700;color:var(--g700)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--g800);color:#fff;font-size:var(--fs-sm);font-weight:600;border-radius:12px;padding:12px 18px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:900;max-width:88vw;text-align:center}
.toast.on{opacity:1}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="hd">
    <div class="seg">
      <button type="button" class="on" data-t="convert">변환하기</button>
      <button type="button" data-t="merge">병합하기</button>
      <button type="button" data-t="edit">편집하기</button>
    </div>
  </div>

  <!-- 변환하기: PDF → PNG -->
  <section class="scr on" id="scrConvert">
    <div class="col">
      <div class="chip" id="dirChip">
        <svg class="li" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <div class="ct" id="dirName">폴더를 고르면 PNG가 바로 거기에 저장돼요</div>
        <button type="button" id="dirPick">폴더 고르기</button>
        <button type="button" class="cx" id="dirClear" style="display:none" aria-label="끌어온 폴더 해제">×</button>
      </div>
      <div id="cvMain">
        <div class="zone" id="cvZone">

<script type="module">
import * as pdfjsLib from './vendor/pdf.min.mjs';
import { initEdit } from './edit.js';
pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.mjs';
const { PDFDocument, degrees } = window.PDFLib;

const DPI = 200;                      // 기존 .bat(-density 200)과 동일 — 조정은 이 상수만
const A4 = [595.28, 841.89];          // 이미지 페이지 규격(세로 A4 맞춤·비율 유지)
const pngName = (base, i, n) => n === 1 ? `${base}.png` : `${base}-이미지-${i}.png`; // 기존 SmallPDF 산출 파일명 패턴(0부터)
const baseName = f => f.replace(/\.[^.]+$/, '');
const $ = s => document.querySelector(s);
const hasFS = 'showDirectoryPicker' in window;

/* ── 공용 ── */
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); }
function busy(on, msg){ $('#busyT').textContent = msg || 'PDF를 만들고 있어요'; $('#busy').classList.toggle('on', !!on); }
function dl(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }

const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('tf-pdf', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  async set(k, v){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); }
};

async function ensureRW(dir){
  let p = await dir.queryPermission({ mode: 'readwrite' });
  if (p !== 'granted') p = await dir.requestPermission({ mode: 'readwrite' });
  return p === 'granted';
}

/* drop 이벤트에서 핸들은 await 전에 동기로 걷어야 한다(dataTransfer가 무효화됨) */
function collectDrop(e){
  const items = [...e.dataTransfer.items];
  const plain = [...e.dataTransfer.files];
  const proms = items.filter(it => it.kind === 'file')
    .map(it => it.getAsFileSystemHandle ? it.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null));
  return { proms, plain };
}
async function pdfsFromDir(dirH){
  const out = [];
  for await (const h of dirH.values()) if (h.kind === 'file' && /\.pdf$/i.test(h.name)) out.push(await h.getFile());
  return out.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
}

/* ── 탭 ── */
const SCREENS = { convert: '#scrConvert', merge: '#scrMerge', edit: '#scrEdit' };
function setTab(t){
  if (!SCREENS[t]) return;
  document.querySelectorAll('.hd .seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  for (const k in SCREENS) $(SCREENS[k]).classList.toggle('on', k === t);
}
function curTab(){ for (const k in SCREENS) if ($(SCREENS[k]).classList.contains('on')) return k; return 'convert'; }
document.querySelectorAll('.hd .seg button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.t)));

/* 페이지 → 캔버스 (변환·썸네일·확대·편집이 공유. 흰 배경을 깐 뒤 렌더) */
async function renderPageCanvas(doc, pageIdx, scale, opts){
  const page = await doc.getPage(pageIdx + 1);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  const task = page.render({ canvasContext: ctx, viewport: vp });
  if (opts && opts.onTask) opts.onTask(task);
  await task.promise;
  return c;
}

/* 결과물 저장 — 폴더를 골라뒀으면 그 폴더에 쓰고(덮어쓴 수를 셈), 아니면 개별 다운로드 */
async function saveItems(items, dir){
  let over = 0;
  for (const it of items){
    if (dir){
      let exists = false; try { await dir.getFileHandle(it.name); exists = true; } catch(e){}
      const fh = await dir.getFileHandle(it.name, { create: true });
      const w = await fh.createWritable(); await w.write(it.blob); await w.close();
      if (exists) over++;
    } else dl(it.name, it.blob);
  }
  return over;
}

/* ═══════════ 변환하기 ═══════════ */
let savedDir = null, dropDir = null;   // dropDir = 폴더째 끌어온 경우 그 폴더에 저장(우선)
let cvFiles = [];                      // {file, pages, status:'ready'|'work'|'ok'|'bad', done, msg}

function renderDirChip(){
  const n = $('#dirName'), clear = $('#dirClear');
  if (dropDir){ n.innerHTML = `끌어온 폴더 <b></b>에 저장해요`; n.querySelector('b').textContent = `'${dropDir.name}'`; clear.style.display = ''; }
  else if (savedDir){ n.innerHTML = `저장 폴더 - <b></b>`; n.querySelector('b').textContent = savedDir.name; clear.style.display = 'none'; }
  else { n.textContent = '폴더를 고르면 저장 위치를 정하지 않아도 계속 거기에 저장돼요'; clear.style.display = 'none'; }
  if (!hasFS){ n.textContent = '변환한 파일은 다운로드 폴더로 받아요'; $('#dirPick').style.display = 'none'; }
}
$('#dirPick').addEventListener('click', async () => {
  if (!hasFS) return;
  try { savedDir = await showDirectoryPicker({ mode: 'readwrite' }); dropDir = null; await idb.set('outDir', savedDir); renderDirChip(); } catch(e){}
});
$('#dirClear').addEventListener('click', () => { dropDir = null; renderDirChip(); });
idb.get('outDir').then(h => { if (h) { savedDir = h; renderDirChip(); } }).catch(() => {});

function renderCvRows(){
  const box = $('#cvRows'); box.innerHTML = '';
  cvFiles.forEach((f, i) => {
    const row = document.createElement('div'); row.className = 'frow';
    const readyTxt = f.kind === 'img' ? '이미지 → PDF' : (f.pages ? `${f.pages}장 → PNG` : '');
    const pct = f.pages ? Math.round(f.done / f.pages * 100) : 0;
    const st = f.status === 'work' ? `<div class="s ok">변환 중${f.kind === 'pdf' ? ` · ${f.done}/${f.pages}장` : ''}</div>${f.kind === 'pdf' ? `<div class="pbar"><i style="width:${pct}%"></i></div>` : ''}`
      : f.status === 'ok' ? `<div class="s ok">저장했어요</div>`
      : f.status === 'bad' ? `<div class="s bad">${f.msg}</div>`
      : `<div class="s">${readyTxt}</div>`;
    row.innerHTML = `<div class="fi"><svg class="li" viewBox="0 0 24 24"><path d="M14 3v5h5M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/></svg></div>
      <div class="fn"><div class="n"></div>${st}</div><button type="button" class="rm" aria-label="빼기">×</button>`;
    row.querySelector('.n').textContent = f.file.name;
    row.querySelector('.rm').addEventListener('click', () => { cvFiles.splice(i, 1); renderCvRows(); });
    box.appendChild(row);
  });
  $('#cvGo').disabled = !cvFiles.length;
}

async function addCvFiles(files){
  const ok = files.filter(f => /\.(pdf|png|jpe?g)$/i.test(f.name));
  const skipped = files.length - ok.length;
  if (skipped) toast(`PDF·PNG·JPG만 넣을 수 있어요 — ${skipped}개는 뺐어요`);
  for (const file of ok){
    const isPdf = /\.pdf$/i.test(file.name);
    const entry = { file, kind: isPdf ? 'pdf' : 'img', pages: isPdf ? null : 1, status: 'ready', done: 0, msg: '' };
    cvFiles.push(entry); renderCvRows();
    if (isPdf){
      try {
        const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        entry.pages = doc.numPages; doc.destroy();
      } catch (err) {
        entry.status = 'bad';
        entry.msg = err && err.name === 'PasswordException' ? '암호가 걸린 PDF예요' : 'PDF를 열 수 없어요';
      }
    }
    renderCvRows();
  }
}

/* 이미지 1장 → A4 세로 맞춤 PDF */
async function imageToPdf(file){
  const bytes = await file.arrayBuffer();
  const out = await PDFDocument.create();
  const img = /\.png$/i.test(file.name) ? await out.embedPng(bytes) : await out.embedJpg(bytes);
  const s = Math.min(A4[0] / img.width, A4[1] / img.height);
  const page = out.addPage([A4[0], A4[1]]);
  page.drawImage(img, { x: (A4[0] - img.width * s) / 2, y: (A4[1] - img.height * s) / 2, width: img.width * s, height: img.height * s });
  return { name: baseName(file.name) + '.pdf', blob: new Blob([await out.save()], { type: 'application/pdf' }) };
}

const cvZone = $('#cvZone');
cvZone.addEventListener('click', () => $('#cvInput').click());
$('#cvInput').addEventListener('change', e => { addCvFiles([...e.target.files]); e.target.value = ''; });

async function routeConvertDrop(proms, plain){
  const handles = await Promise.all(proms);
  const files = []; let usedHandles = false;
  for (const h of handles){
    if (!h) continue; usedHandles = true;
    if (h.kind === 'directory'){
      const inner = await pdfsFromDir(h);
      if (inner.length){ dropDir = h; renderDirChip(); files.push(...inner); }
      else toast('폴더에 PDF가 없어요');
    } else files.push(await h.getFile());
  }
  if (!usedHandles) files.push(...plain);
  if (files.length) addCvFiles(files);
}

/* 변환 파이프라인 — 테스트 훅에서도 직접 호출 */
async function convertPdfToPngs(file, onProgress){
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const n = doc.numPages, base = baseName(file.name), out = [];
  for (let i = 1; i <= n; i++){
    const c = await renderPageCanvas(doc, i - 1, DPI / 72);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    out.push({ name: pngName(base, i - 1, n), blob });
    if (onProgress) onProgress(i, n);
  }
  doc.destroy();
  return out;
}

$('#cvGo').addEventListener('click', async () => {
  if (!cvFiles.length) return;
  // 폴더를 골라뒀으면 그 폴더에 즉시 저장(재선택 없음), 안 골랐으면 다운로드 폴더로
  const dir = dropDir || savedDir;
  if (dir && !(await ensureRW(dir))){ toast('폴더 권한을 허용하면 저장할 수 있어요'); return; }
  $('#cvGo').disabled = true;
  let png = 0, pdf = 0, over = 0, failed = 0;
  for (const f of cvFiles){
    if (f.status === 'bad'){ failed++; continue; }
    f.status = 'work'; f.done = 0; renderCvRows();
    try {
      if (f.kind === 'pdf'){
        const items = await convertPdfToPngs(f.file, (i) => { f.done = i; renderCvRows(); });
        over += await saveItems(items, dir); png += items.length;
      } else { over += await saveItems([await imageToPdf(f.file)], dir); pdf++; }
      f.status = 'ok';
    } catch (err) { f.status = 'bad'; f.msg = '열 수 없어요'; failed++; }
    renderCvRows();
  }
  const parts = [];
  if (png) parts.push(`PNG ${png}장`);
  if (pdf) parts.push(`PDF ${pdf}개`);
  const subs = [];
  if (over) subs.push(`같은 이름 ${over}장은 덮어썼어요`);
  if (!dir && parts.length) subs.push('다운로드 폴더로 받았어요');
  if (failed) subs.push(`${failed}개는 열 수 없었어요`);
  showDone(parts.length ? `${parts.join('·')} 저장했어요` : '변환하지 못했어요', subs.join(' · '), failed > 0,
    () => { cvFiles = []; renderCvRows(); });
});

/* §4.9 비활성 버튼 눌림 = shake (disabled는 클릭 투명 → 부모 위임) */
document.querySelector('#scrConvert .foot').addEventListener('pointerdown', () => {
  const b = $('#cvGo');
  if (b.disabled){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
});

/* §4.6 완료 화면: 체크 팝인+제목(+한줄 서브) → 1.6초 뒤 왼쪽 슬라이드 자동 전환. 실패 안내가 있으면 버튼형 */
let doneTimer = null;
function showDone(title, sub, needBtn, after){
  const o = $('#doneo');
  $('#doneT').textContent = title;
  $('#doneS').textContent = sub || ''; $('#doneS').style.display = sub ? '' : 'none';
  const btn = $('#doneBtn'); btn.style.display = needBtn ? '' : 'none';
  const svg = o.querySelector('.dcirc'); const fresh = svg.cloneNode(true); svg.replaceWith(fresh); // 애니 재시작
  o.classList.remove('out'); o.classList.add('on');
  const close = () => { o.classList.add('out'); setTimeout(() => { o.classList.remove('on', 'out'); if (after) after(); }, 300); };
  clearTimeout(doneTimer);
  if (needBtn) btn.onclick = close;
  else doneTimer = setTimeout(close, 1600);
}

/* ═══════════ 병합하기 ═══════════ */
let seq = 0;
const sources = new Map();  // srcId → {name, bytes, type:'pdf'|'png'|'jpg', url?, pjs?}
let mgItems = [];           // {id, kind:'pdfPage'|'image', srcId, pageIndex, rot, thumb?, el?}

function srcColor(id){ return `hsl(${(id * 67) % 360} 42% 52%)`; }
function getPjs(src){
  if (!src.pjs) src.pjs = pdfjsLib.getDocument({ data: src.bytes.slice(0) }).promise; // pdf.js가 버퍼를 가져가므로 사본
  return src.pjs;
}

async function addMergeFiles(files, at){
  const ok = files.filter(f => /\.(pdf|png|jpe?g)$/i.test(f.name));
  if (files.length - ok.length) toast(`PDF·PNG·JPG만 넣을 수 있어요 — ${files.length - ok.length}개는 뺐어요`);
  const fresh = [];
  for (const file of ok){
    const bytes = await file.arrayBuffer();
    const id = ++seq;
    if (/\.pdf$/i.test(file.name)){
      const src = { name: file.name, bytes, type: 'pdf' };
      try {
        const doc = await getPjs(src);
        sources.set(id, src);
        for (let p = 0; p < doc.numPages; p++) fresh.push({ id: ++seq, kind: 'pdfPage', srcId: id, pageIndex: p, rot: 0 });
      } catch(err){ toast(`'${file.name}'은 열 수 없어요`); }
    } else {
      const type = /\.png$/i.test(file.name) ? 'png' : 'jpg';
      sources.set(id, { name: file.name, bytes, type, url: URL.createObjectURL(new Blob([bytes])) });
      fresh.push({ id: ++seq, kind: 'image', srcId: id, pageIndex: 0, rot: 0 });
    }
  }
  if (!fresh.length) return;
  const idx = (at === undefined || at === null) ? mgItems.length : at;
  mgItems.splice(idx, 0, ...fresh);
  renderMerge();
}

/* 썸네일 — 보이는 카드만 렌더(캐시), 회전은 CSS transform */
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ const it = mgItems.find(m => m.el === en.target); if (it) renderThumb(it); } }), { rootMargin: '200px' });
async function renderThumb(it){
  if (it.thumb || it.rendering) return; it.rendering = true;
  try {
    const src = sources.get(it.srcId);
    if (it.kind === 'image'){ const img = new Image(); img.src = src.url; await img.decode(); it.thumb = img; }
    else {
      const doc = await getPjs(src);
      const vp0 = (await doc.getPage(it.pageIndex + 1)).getViewport({ scale: 1 });
      it.thumb = await renderPageCanvas(doc, it.pageIndex, 300 / vp0.width);
    }
    if (it.el){ const th = it.el.querySelector('.th'); th.innerHTML = ''; th.appendChild(it.thumb); applyRot(it); }
  } finally { it.rendering = false; }
}
function applyRot(it){
  if (!it.thumb || !it.el) return;
  const th = it.el.querySelector('.th'), box = th.getBoundingClientRect();
  const cw = it.thumb.width || it.thumb.naturalWidth, ch = it.thumb.height || it.thumb.naturalHeight;
  const s0 = Math.min(box.width / cw, box.height / ch), dw = cw * s0, dh = ch * s0;
  const fit = (it.rot % 180) ? Math.min(box.width / dh, box.height / dw) : 1;
  it.thumb.style.transform = `rotate(${it.rot}deg) scale(${fit})`;
}

function renderMerge(){
  const has = mgItems.length > 0;
  $('#mgEmpty').style.display = has ? 'none' : '';
  $('#mgMain').style.display = has ? '' : 'none';
  if (!has) return;
  $('#mgCnt').innerHTML = `<b>${mgItems.length}</b>페이지`;
  const grid = $('#mgGrid'); grid.innerHTML = '';
  mgItems.forEach((it, i) => {
    const src = sources.get(it.srcId);
    const card = document.createElement('div'); card.className = 'card'; card.dataset.i = i;
    card.innerHTML = `<div class="th"></div>
      <div class="lb"><span class="dot"></span><span class="t"></span></div>
      <div class="ops">
        <button type="button" data-op="zoom" title="확대"><svg class="li" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.6-4.6M11 8.2v5.6M8.2 11h5.6"/></svg></button>
        <button type="button" data-op="rot" title="회전"><svg class="li" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 2 6M20 3v5h-5"/></svg></button>
        <button type="button" data-op="del" title="빼기"><svg class="li" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
      </div>`;
    card.querySelector('.dot').style.background = srcColor(it.srcId);
    card.querySelector('.t').textContent = it.kind === 'pdfPage' ? `${baseName(src.name)} · ${it.pageIndex + 1}` : baseName(src.name);
    card.querySelector('.t').title = src.name;
    if (it.thumb){ card.querySelector('.th').appendChild(it.thumb); }
    card.querySelector('[data-op=zoom]').addEventListener('click', e => { e.stopPropagation(); openZoom(i); });
    card.querySelector('[data-op=rot]').addEventListener('click', e => { e.stopPropagation(); rotateItem(i); });
    card.querySelector('[data-op=del]').addEventListener('click', e => { e.stopPropagation(); removeItem(i); });
    grid.appendChild(card);
    it.el = card;
    if (!it.thumb) io.observe(card); else requestAnimationFrame(() => applyRot(it));
  });
  const add = document.createElement('button'); add.type = 'button'; add.className = 'addcard'; add.id = 'mgAdd';
  add.innerHTML = `<svg class="li" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>추가하기</span>`;
  add.addEventListener('click', () => $('#mgInput').click());
  grid.appendChild(add);
  const bar = document.createElement('div'); bar.className = 'insbar'; bar.id = 'insBar';
  grid.appendChild(bar);
}
function rotateItem(i){ const it = mgItems[i]; it.rot = (it.rot + 90) % 360; applyRot(it); }

/* 확대(돋보기) — 페이지를 크게 렌더해 전체 화면으로 */
function rotCanvas(srcImg, sw, sh, rot){
  if (!rot && srcImg instanceof HTMLCanvasElement) return srcImg;
  const [w, h] = rot % 180 ? [sh, sw] : [sw, sh];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.translate(w / 2, h / 2); x.rotate(rot * Math.PI / 180); x.drawImage(srcImg, -sw / 2, -sh / 2);
  return c;
}
function openZoom(i){
  const it = mgItems[i]; if (!it) return;
  const o = $('#zoomo'); o.innerHTML = '';
  (async () => {
    const src = sources.get(it.srcId);
    let el;
    if (it.kind === 'image'){
      const bmp = await createImageBitmap(new Blob([src.bytes]));
      el = rotCanvas(bmp, bmp.width, bmp.height, it.rot);
    } else {
      const doc = await getPjs(src);
      const vp0 = (await doc.getPage(it.pageIndex + 1)).getViewport({ scale: 1 });
      const c = await renderPageCanvas(doc, it.pageIndex, Math.min(1600 / vp0.width, 1600 / vp0.height, 3));
      el = rotCanvas(c, c.width, c.height, it.rot);
    }
    o.appendChild(el); o.classList.add('on');
  })();
}
$('#zoomo').addEventListener('click', () => $('#zoomo').classList.remove('on'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#zoomo').classList.remove('on'); });
function removeItem(i){ mgItems.splice(i, 1); renderMerge(); }
function moveItem(from, gap){ const [it] = mgItems.splice(from, 1); mgItems.splice(gap > from ? gap - 1 : gap, 0, it); renderMerge(); }
function clearMerge(){ mgItems = []; sources.forEach(s => s.url && URL.revokeObjectURL(s.url)); sources.clear(); renderMerge(); }
$('#mgClear2').addEventListener('click', () => $('#clearSheet').classList.add('on'));
$('#csClose').addEventListener('click', () => $('#clearSheet').classList.remove('on'));
$('#csGo').addEventListener('click', () => { $('#clearSheet').classList.remove('on'); clearMerge(); });
$('#mgInput').addEventListener('change', e => { addMergeFiles([...e.target.files]); e.target.value = ''; });

/* 삽입 위치: 그리드 좌표 → gap 인덱스(0=맨앞 … n=맨뒤) */
function gapIndex(px, py){
  const cards = [...$('#mgGrid').querySelectorAll('.card:not(.ghost)')];
  for (const c of cards){
    const r = c.getBoundingClientRect();
    if (py < r.top) return +c.dataset.i;
    if (py <= r.bottom && px < r.left + r.width / 2) return +c.dataset.i;
    if (py <= r.bottom && px <= r.right) return +c.dataset.i + 1;
  }
  return mgItems.length;
}
function showInsBar(gap){
  const bar = $('#insBar'); if (!bar) return;
  const grid = $('#mgGrid'), gr = grid.getBoundingClientRect();
  const cards = [...grid.querySelectorAll('.card')];
  if (!cards.length){ bar.style.display = 'none'; return; }
  const ref = gap < cards.length ? cards[gap].getBoundingClientRect() : cards[cards.length - 1].getBoundingClientRect();
  const left = gap < cards.length ? ref.left - gr.left - 9 : ref.right - gr.left + 5;
  bar.style.display = 'block';
  bar.style.left = left + 'px';
  bar.style.top = (ref.top - gr.top) + 'px';
  bar.style.height = ref.height + 'px';
}
function hideInsBar(){ const b = $('#insBar'); if (b) b.style.display = 'none'; }

/* 드롭 = 앱 전체 배경이 받는다. 변환 탭=변환 목록으로 / 병합 탭=카드 사이면 그 자리 삽입(insbar),
   좌우·아래 여백이면 맨뒤 추가(점선 카드가 드롭존처럼 하이라이트) */
$('#mgZone').addEventListener('click', () => $('#mgInput').click());
function mergeDropTarget(x, y){
  const gr = $('#mgGrid').getBoundingClientRect();
  const inside = x >= gr.left && x <= gr.right && y >= gr.top && y <= gr.bottom;
  const gap = inside ? gapIndex(x, y) : mgItems.length;
  return { gap, between: inside && gap < mgItems.length };
}
function clearDropCues(){
  hideInsBar();
  const add = document.getElementById('mgAdd'); if (add) add.classList.remove('drag');
  $('#mgZone').classList.remove('drag');
  cvZone.classList.remove('drag');
  $('#edZone').classList.remove('drag');
  $('#edCv').classList.remove('drag');
}
// 내부 <img> 썸네일의 네이티브 드래그 차단 — 크로미움은 이미지 드래그에 파일 페이로드를 실어
// 아래 body drop이 '새 이미지 삽입'으로 오인한다(pointer 재배열과 동시 발화 → a,b가 b,a,b로 복제).
// PDF 페이지 썸네일은 canvas라 무관, 외부 파일 드롭은 dragstart 자체가 안 떠 영향 없음.
document.addEventListener('dragstart', e => e.preventDefault());
document.body.addEventListener('dragover', e => {
  if (![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  const tab = curTab();
  if (tab === 'convert'){ cvZone.classList.add('drag'); return; }
  if (tab === 'edit'){ $(edHasDoc() ? '#edCv' : '#edZone').classList.add('drag'); return; }
  if (!mgItems.length){ $('#mgZone').classList.add('drag'); return; }
  const t = mergeDropTarget(e.clientX, e.clientY);
  const add = document.getElementById('mgAdd');
  if (t.between){ showInsBar(t.gap); if (add) add.classList.remove('drag'); }
  else { hideInsBar(); if (add) add.classList.add('drag'); }
});
document.body.addEventListener('dragleave', e => { if (!e.relatedTarget) clearDropCues(); });
document.body.addEventListener('drop', e => {
  e.preventDefault();
  const tab = curTab();
  const at = tab === 'merge' && mgItems.length ? mergeDropTarget(e.clientX, e.clientY).gap : undefined;
  clearDropCues();
  const { proms, plain } = collectDrop(e);
  if (tab === 'convert'){ routeConvertDrop(proms, plain); return; }
  if (tab === 'edit'){ (async () => {
    const handles = await Promise.all(proms);
    const files = [];
    for (const h of handles){ if (h && h.kind === 'file') files.push(await h.getFile()); }
    edDrop(files.length ? files : plain);
  })(); return; }
  (async () => {
    const handles = await Promise.all(proms);
    const files = []; let used = false;
    for (const h of handles){
      if (!h) continue; used = true;
      if (h.kind === 'directory'){ for await (const fh of h.values()) if (fh.kind === 'file' && /\.(pdf|png|jpe?g)$/i.test(fh.name)) files.push(await fh.getFile()); }
      else files.push(await h.getFile());
    }
    if (!used) files.push(...plain);
    if (files.length) addMergeFiles(files, at);
  })();
});

/* 카드 드래그 재배열(pointer) */
(function(){
  const grid = $('#mgGrid');
  let from = -1, fly = null, gap = -1, sx = 0, sy = 0, active = false;
  grid.addEventListener('pointerdown', e => {
    const card = e.target.closest('.card');
    if (!card || e.target.closest('.ops')) return;
    from = +card.dataset.i; sx = e.clientX; sy = e.clientY; active = false;
    grid.setPointerCapture(e.pointerId);
  });
  grid.addEventListener('pointermove', e => {
    if (from < 0) return;
    if (!active){
      if (Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
      active = true;
      const card = grid.querySelector(`.card[data-i="${from}"]`);
      const r = card.getBoundingClientRect();
      fly = card.cloneNode(true); fly.classList.add('fly');
      fly.style.width = r.width + 'px'; fly.querySelector('.ops').remove();
      const th = mgItems[from].thumb;
      if (th){
        const fth = fly.querySelector('.th'); fth.innerHTML = '';
        let copy;
        if (th.tagName === 'CANVAS'){ // 캔버스 cloneNode는 픽셀이 빈 채 복제됨 — 다시 그린다
          copy = document.createElement('canvas'); copy.width = th.width; copy.height = th.height;
          copy.getContext('2d').drawImage(th, 0, 0);
        } else copy = th.cloneNode(true);
        copy.style.transform = th.style.transform;
        fth.appendChild(copy);
      }
      document.body.appendChild(fly);
      card.classList.add('ghost');
    }
    fly.style.left = e.clientX + 'px'; fly.style.top = e.clientY + 'px';
    gap = gapIndex(e.clientX, e.clientY);
    showInsBar(gap);
  });
  const end = e => {
    if (from < 0) return;
    const card = grid.querySelector(`.card[data-i="${from}"]`);
    if (card) card.classList.remove('ghost');
    if (fly){ fly.remove(); fly = null; }
    hideInsBar();
    if (active && gap >= 0 && gap !== from && gap !== from + 1) moveItem(from, gap);
    from = -1; gap = -1; active = false;
  };
  grid.addEventListener('pointerup', end);
  grid.addEventListener('pointercancel', end);
})();

/* 병합 빌드 — 테스트 훅에서도 직접 호출 */
async function rotateImageBytes(src, rot){
  const bmp = await createImageBitmap(new Blob([src.bytes]));
  const sw = bmp.width, sh = bmp.height;
  const [w, h] = rot % 180 ? [sh, sw] : [sw, sh];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.translate(w / 2, h / 2); ctx.rotate(rot * Math.PI / 180); ctx.drawImage(bmp, -sw / 2, -sh / 2);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return await blob.arrayBuffer();
}
async function buildMergedPdf(){
  const out = await PDFDocument.create();
  const loaded = new Map();
  for (const it of mgItems){
    const src = sources.get(it.srcId);
    if (it.kind === 'pdfPage'){
      let sd = loaded.get(it.srcId);
      if (!sd){ sd = await PDFDocument.load(src.bytes, { ignoreEncryption: true }); loaded.set(it.srcId, sd); }
      const [p] = await out.copyPages(sd, [it.pageIndex]);
      if (it.rot) p.setRotation(degrees(((p.getRotation().angle || 0) + it.rot) % 360));
      out.addPage(p);
    } else {
      let bytes = src.bytes, isPng = src.type === 'png';
      if (it.rot){ bytes = await rotateImageBytes(src, it.rot); isPng = true; }
      const img = isPng ? await out.embedPng(bytes) : await out.embedJpg(bytes);
      const s = Math.min(A4[0] / img.width, A4[1] / img.height);
      const w = img.width * s, h = img.height * s;
      const page = out.addPage([A4[0], A4[1]]);
      page.drawImage(img, { x: (A4[0] - w) / 2, y: (A4[1] - h) / 2, width: w, height: h });
    }
  }
  return await out.save();
}
$('#mgSave').addEventListener('click', async () => {
  if (!mgItems.length) return;
  const first = sources.get(mgItems[0].srcId);
  const name = `${baseName(first.name)}-병합됨.pdf`;
  let fh = null;
  if ('showSaveFilePicker' in window){
    try { fh = await showSaveFilePicker({ suggestedName: name, types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }] }); }
    catch(e){ return; }   // 저장 창을 닫음 = 그대로 둠
  }
  busy(true);
  try {
    const bytes = await buildMergedPdf();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    if (fh){ const w = await fh.createWritable(); await w.write(blob); await w.close(); }
    else dl(name, blob);
    busy(false);
    showDone('PDF를 저장했어요', '', false);
  } catch(err){ busy(false); toast('PDF를 만드는 데 실패했어요'); }
});

/* 연결 프로그램(.pdf 더블클릭)으로 열린 파일 받기 */
if ('launchQueue' in window){
  launchQueue.setConsumer(async p => {
    if (!p.files || !p.files.length) return;
    const files = await Promise.all(p.files.map(h => h.getFile()));
    setTab('convert'); addCvFiles(files);
  });
}

renderDirChip();

/* ═══════════ 편집하기 (edit.js) ═══════════ */
const edit = initEdit({
  pdfjsLib, PDFLib: window.PDFLib, $, toast, busy, dl, showDone, baseName, DPI, A4,
  getPjs, renderPageCanvas, saveItems, idb, ensureRW, setTab,
  getOutDir: () => dropDir || savedDir
});
const edHasDoc = edit.hasDoc, edDrop = edit.drop;

/* 헤드리스 검증 훅 — 데이터 없음, UI와 같은 함수를 그대로 노출 */
window.__tf = { convertPdfToPngs, imageToPdf, addCvFiles, addMergeFiles, buildMergedPdf, moveItem, rotateItem, removeItem, clearMerge, setTab, curTab, zoom: openZoom, items: () => mgItems, DPI, pdfjs: pdfjsLib,
  renderPageCanvas, saveItems, edit,
  _setDir: h => { savedDir = h; renderDirChip(); } };
</script>
<script src="install.js"></script>
</body>
</html>
